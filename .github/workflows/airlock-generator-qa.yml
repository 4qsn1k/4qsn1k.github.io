name: Airlock Generator QA (headless)

on:
  push:
    paths:
      - 'airlock-generator/**'
      - '.github/workflows/airlock-generator-qa.yml'
  pull_request:
    paths:
      - 'airlock-generator/**'
      - '.github/workflows/airlock-generator-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-offline-tests:
    name: Full offline QA (Node, Python, mock TCP/RTU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: airlock-generator
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Full deterministic software QA
        run: bash scripts/codex-check.sh
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airlock-full-offline-qa
          path: airlock-generator/qa-reports/
          if-no-files-found: warn
          retention-days: 30

# No physical PLC, Owen Logic GUI, Modbus network, secrets or writes.
