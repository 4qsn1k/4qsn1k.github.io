name: Airlock Generator QA (headless)

on:
  push:
    paths:
      - 'airlock-generator/**'
      - '.github/workflows/airlock-generator-qa.yml'
  pull_request:
    paths:
      - 'airlock-generator/**'
      - '.github/workflows/airlock-generator-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-offline-tests:
    name: Full offline QA (Node, Python, mock TCP/RTU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: airlock-generator
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Full deterministic software QA
        run: |
          mkdir -p qa-reports
          set -o pipefail
          bash scripts/codex-check.sh 2>&1 | tee qa-reports/codex-check.log
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airlock-full-offline-qa
          path: airlock-generator/qa-reports/
          if-no-files-found: warn
          retention-days: 30

# No physical PLC, Owen Logic GUI, Modbus network, secrets or writes.

  rtu-library-offline:
    name: Real RTU library with memory adapter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: airlock-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned test-only RTU library
        run: python -m pip install -r tests/requirements-rtu.txt
      - name: Real pymodbus CRC and fake serial recovery
        run: python -B tests/rtu-library-faults.py
      - name: Python helper ownership and library boundary faults
        run: python -B tests/rtu-worker-faults.py
      - name: Bounded worker supervisor
        run: node tests/rtu-supervisor.test.js
      - name: Controller isolation and local profiles
        run: |
          node tests/agent-reliability.test.js
          node tests/profile-store.test.js
      - name: Fake TCP fault and recovery smoke
        run: node tests/tcp-faults.test.js
