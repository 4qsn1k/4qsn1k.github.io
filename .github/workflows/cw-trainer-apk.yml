name: CW Trainer Android APK
on:
  push:
    branches: [codex/cw-trainer-apk-v01]
    paths:
      - 'cw-trainer-android/app/**'
      - 'cw-trainer-android/settings.gradle.kts'
      - 'cw-trainer-android/gradle.properties'
      - '.github/workflows/cw-trainer-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        run: gradle -p cw-trainer-android --no-daemon :app:assembleDebug
      - name: Test Activity startup
        run: gradle -p cw-trainer-android --no-daemon :app:testDebugUnitTest
      - name: Save APK
        run: |
          mkdir -p cw-trainer-android/dist
          cp cw-trainer-android/app/build/outputs/apk/debug/app-debug.apk cw-trainer-android/dist/CW-Trainer-Pocket-v0.2-debug.apk
          sha256sum cw-trainer-android/dist/CW-Trainer-Pocket-v0.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CW-Trainer-Pocket-v0.2-APK
          path: cw-trainer-android/dist/CW-Trainer-Pocket-v0.2-debug.apk
      - name: Publish directly downloadable APK to build branch
        continue-on-error: true
        run: |
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add cw-trainer-android/dist/CW-Trainer-Pocket-v0.2-debug.apk
          git commit -m "Build Android debug APK" || exit 0
          git push
